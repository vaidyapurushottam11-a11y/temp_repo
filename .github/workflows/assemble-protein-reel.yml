name: Assemble Protein Reel 03

on:
  push:
    paths:
      - '.github/workflows/assemble-protein-reel.yml'
      - 'reel3/protein_master.jpg'
      - 'reel3/protein_reel_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FFmpeg and source
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          test -f reel3/protein_master.jpg
          ffprobe -v error -show_entries stream=width,height -of default=nw=1 reel3/protein_master.jpg

      - name: Build fast educational segments
        run: |
          set -euo pipefail
          SRC='reel3/protein_master.jpg'
          ENC='-c:v libx264 -preset ultrafast -crf 16 -pix_fmt yuv420p -r 30 -an'

          make_full () {
            out="$1"; dur="$2"
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 30 -i "$SRC" -t "$dur" \
              -vf "scale=1080:1920:flags=bicubic,setsar=1,fps=30" \
              $ENC "$out"
          }

          make_card () {
            out="$1"; x="$2"; y="$3"; w="$4"; h="$5"; dur="$6"
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 30 -i "$SRC" -t "$dur" \
              -filter_complex "[0:v]scale=1080:1920:flags=bicubic,split=2[bg0][fg0];[bg0]eq=brightness=-0.06:saturation=0.70[bg];[fg0]crop=${w}:${h}:${x}:${y},scale=980:-2:flags=bicubic,pad=1020:ih+40:20:20:color=0xfffbf3[card];[bg][card]overlay=(W-w)/2:(H-h)/2,setsar=1,fps=30[out]" \
              -map "[out]" $ENC "$out"
          }

          # Total target: 11.30 seconds
          make_full seg00.mp4 1.00
          make_card seg01.mp4 22 520 438 235 1.35
          make_card seg02.mp4 474 520 436 235 1.35
          make_card seg03.mp4 22 770 438 252 1.20
          make_card seg04.mp4 474 770 436 252 1.45
          make_card seg05.mp4 22 1038 438 180 1.35
          make_card seg06.mp4 22 1230 886 316 1.65
          make_full seg07.mp4 1.95

      - name: Assemble final 11.3-second reel
        run: |
          set -euo pipefail
          cat > concat.txt <<'EOF'
          file 'seg00.mp4'
          file 'seg01.mp4'
          file 'seg02.mp4'
          file 'seg03.mp4'
          file 'seg04.mp4'
          file 'seg05.mp4'
          file 'seg06.mp4'
          file 'seg07.mp4'
          EOF

          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt \
            -c copy -movflags +faststart built_capable_reel03_protein_final.mp4

      - name: Validate final output
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=nw=1 built_capable_reel03_protein_final.mp4

      - name: Upload ready-to-post MP4
        uses: actions/upload-artifact@v4
        with:
          name: built_capable_reel03_protein_final
          path: built_capable_reel03_protein_final.mp4
          if-no-files-found: error
          retention-days: 7
