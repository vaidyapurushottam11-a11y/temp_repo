name: Assemble Protein Reel 03 from Kling Motion

on:
  push:
    paths:
      - 'reel3/protein_kling_motion_5s.mp4'
  workflow_dispatch:

concurrency:
  group: protein-reel03-kling
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate Kling source
        run: |
          set -euo pipefail
          test -f reel3/protein_kling_motion_5s.mp4
          ffprobe -v error \
            -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
            -of default=nw=1 reel3/protein_kling_motion_5s.mp4

      - name: Build 10-second Kling-motion Reel
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i reel3/protein_kling_motion_5s.mp4 \
            -filter_complex "[0:v]scale=1080:1920:flags=lanczos,fps=30,split=2[a][b];[a]setpts=PTS-STARTPTS[a1];[b]setpts=PTS-STARTPTS[b1];[a1][b1]concat=n=2:v=1:a=0,trim=duration=10.00,setpts=PTS-STARTPTS,format=yuv420p[v]" \
            -map '[v]' -an \
            -c:v libx264 -preset veryfast -crf 18 -movflags +faststart \
            built_capable_reel03_protein_kling_10s.mp4

      - name: Validate final output
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=nw=1 built_capable_reel03_protein_kling_10s.mp4

      - name: Upload ready-to-post MP4
        uses: actions/upload-artifact@v4
        with:
          name: built_capable_reel03_protein_kling_10s
          path: built_capable_reel03_protein_kling_10s.mp4
          if-no-files-found: error
          retention-days: 7
