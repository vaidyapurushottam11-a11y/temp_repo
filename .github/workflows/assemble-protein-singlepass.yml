name: Assemble Protein Reel 03 Single Pass

on:
  push:
    paths:
      - '.github/workflows/assemble-protein-singlepass.yml'
  workflow_dispatch:

concurrency:
  group: protein-reel03-singlepass
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate source
        run: |
          set -euo pipefail
          test -f reel3/protein_master.jpg
          ffprobe -v error -show_entries stream=width,height -of default=nw=1 reel3/protein_master.jpg

      - name: Build Reel in one FFmpeg pass
        run: |
          set -euo pipefail
          SRC='reel3/protein_master.jpg'

          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -t 11.30 -i "$SRC" \
            -filter_complex "
              [0:v]scale=1080:1920:flags=bicubic,setsar=1,split=8[v0][v1][v2][v3][v4][v5][v6][v7];
              [v0]trim=start=0:end=1.00,setpts=PTS-STARTPTS[s0];
              [v1]trim=start=1.00:end=2.35,crop=438:235:22:520,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3,setpts=PTS-STARTPTS[s1];
              [v2]trim=start=2.35:end=3.70,crop=436:235:474:520,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3,setpts=PTS-STARTPTS[s2];
              [v3]trim=start=3.70:end=4.90,crop=438:252:22:770,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3,setpts=PTS-STARTPTS[s3];
              [v4]trim=start=4.90:end=6.35,crop=436:252:474:770,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3,setpts=PTS-STARTPTS[s4];
              [v5]trim=start=6.35:end=7.70,crop=438:180:22:1038,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3,setpts=PTS-STARTPTS[s5];
              [v6]trim=start=7.70:end=9.35,crop=886:316:22:1230,scale=1040:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3,setpts=PTS-STARTPTS[s6];
              [v7]trim=start=9.35:end=11.30,setpts=PTS-STARTPTS[s7];
              [s0][s1][s2][s3][s4][s5][s6][s7]concat=n=8:v=1:a=0,fps=30,format=yuv420p[out]
            " \
            -map '[out]' -an \
            -c:v libx264 -preset ultrafast -crf 17 -movflags +faststart \
            built_capable_reel03_protein_singlepass.mp4

      - name: Validate final output
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=nw=1 built_capable_reel03_protein_singlepass.mp4

      - name: Upload ready-to-post MP4
        uses: actions/upload-artifact@v4
        with:
          name: built_capable_reel03_protein_singlepass
          path: built_capable_reel03_protein_singlepass.mp4
          if-no-files-found: error
          retention-days: 7
