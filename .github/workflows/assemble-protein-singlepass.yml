name: Assemble Protein Reel 03 Single Pass

on:
  push:
    paths:
      - '.github/workflows/assemble-protein-singlepass.yml'
  workflow_dispatch:

concurrency:
  group: protein-reel03-singlepass
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil

      - name: Repair source and render infographic views once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          src = 'reel3/protein_master.jpg'
          im = Image.open(src)
          im.load()
          im = im.convert('RGB')
          base = im.resize((1080, 1920), Image.Resampling.LANCZOS)

          def save_jpg(img, path):
              img.save(path, 'JPEG', quality=94, subsampling=0, optimize=True)

          def card_view(box, target_w, path):
              card = base.crop(box)
              target_h = round(card.height * target_w / card.width)
              card = card.resize((target_w, target_h), Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', (1080, 1920), (255, 251, 243))
              x = (1080 - target_w) // 2
              y = (1920 - target_h) // 2
              canvas.paste(card, (x, y))
              save_jpg(canvas, path)

          save_jpg(base, 'view0.jpg')
          card_view((22, 520, 22+438, 520+235), 980, 'view1.jpg')
          card_view((474, 520, 474+436, 520+235), 980, 'view2.jpg')
          card_view((22, 770, 22+438, 770+252), 980, 'view3.jpg')
          card_view((474, 770, 474+436, 770+252), 980, 'view4.jpg')
          card_view((22, 1038, 22+438, 1038+180), 980, 'view5.jpg')
          card_view((22, 1230, 22+886, 1230+316), 1040, 'view6.jpg')
          save_jpg(base, 'view7.jpg')
          print('Repaired source and rendered 8 views successfully')
          PY

      - name: Build 11.3-second Reel from still views
        run: |
          set -euo pipefail
          cat > timeline.txt <<'EOF'
          file 'view0.jpg'
          duration 1.00
          file 'view1.jpg'
          duration 1.35
          file 'view2.jpg'
          duration 1.35
          file 'view3.jpg'
          duration 1.20
          file 'view4.jpg'
          duration 1.45
          file 'view5.jpg'
          duration 1.35
          file 'view6.jpg'
          duration 1.65
          file 'view7.jpg'
          duration 1.95
          file 'view7.jpg'
          EOF

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i timeline.txt \
            -vf "fps=30,format=yuv420p" -an \
            -c:v libx264 -preset ultrafast -crf 17 -movflags +faststart \
            built_capable_reel03_protein_singlepass.mp4

      - name: Validate final output
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=nw=1 built_capable_reel03_protein_singlepass.mp4

      - name: Upload ready-to-post MP4
        uses: actions/upload-artifact@v4
        with:
          name: built_capable_reel03_protein_singlepass
          path: built_capable_reel03_protein_singlepass.mp4
          if-no-files-found: error
          retention-days: 7
