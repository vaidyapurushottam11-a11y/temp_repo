name: Assemble Protein Reel 03 Single Pass

on:
  push:
    paths:
      - '.github/workflows/assemble-protein-singlepass.yml'
  workflow_dispatch:

concurrency:
  group: protein-reel03-singlepass
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Validate source
        run: |
          set -euo pipefail
          test -f reel3/protein_master.jpg
          ffprobe -v error -show_entries stream=width,height -of default=nw=1 reel3/protein_master.jpg

      - name: Render infographic views once
        run: |
          set -euo pipefail
          SRC='reel3/protein_master.jpg'
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "scale=1080:1920:flags=bicubic" -frames:v 1 view0.jpg
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "scale=1080:1920:flags=bicubic,crop=438:235:22:520,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3" -frames:v 1 view1.jpg
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "scale=1080:1920:flags=bicubic,crop=436:235:474:520,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3" -frames:v 1 view2.jpg
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "scale=1080:1920:flags=bicubic,crop=438:252:22:770,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3" -frames:v 1 view3.jpg
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "scale=1080:1920:flags=bicubic,crop=436:252:474:770,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3" -frames:v 1 view4.jpg
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "scale=1080:1920:flags=bicubic,crop=438:180:22:1038,scale=980:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3" -frames:v 1 view5.jpg
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -vf "scale=1080:1920:flags=bicubic,crop=886:316:22:1230,scale=1040:-2:flags=bicubic,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0xfffbf3" -frames:v 1 view6.jpg
          cp view0.jpg view7.jpg

      - name: Build 11.3-second Reel from still views
        run: |
          set -euo pipefail
          cat > timeline.txt <<'EOF'
          file 'view0.jpg'
          duration 1.00
          file 'view1.jpg'
          duration 1.35
          file 'view2.jpg'
          duration 1.35
          file 'view3.jpg'
          duration 1.20
          file 'view4.jpg'
          duration 1.45
          file 'view5.jpg'
          duration 1.35
          file 'view6.jpg'
          duration 1.65
          file 'view7.jpg'
          duration 1.95
          file 'view7.jpg'
          EOF

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i timeline.txt \
            -vf "fps=30,format=yuv420p" -an \
            -c:v libx264 -preset ultrafast -crf 17 -movflags +faststart \
            built_capable_reel03_protein_singlepass.mp4

      - name: Validate final output
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=nw=1 built_capable_reel03_protein_singlepass.mp4

      - name: Upload ready-to-post MP4
        uses: actions/upload-artifact@v4
        with:
          name: built_capable_reel03_protein_singlepass
          path: built_capable_reel03_protein_singlepass.mp4
          if-no-files-found: error
          retention-days: 7
