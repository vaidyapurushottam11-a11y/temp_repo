name: Assemble Protein Reel 03 From Kling Motion

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Temporary signed MP4 URL for the approved 5-second Kling clip'
        required: true
        type: string

concurrency:
  group: protein-reel03-kling-motion
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download approved 5-second Kling motion
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$VIDEO_URL" -o protein_motion_5s.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of default=nw=1 protein_motion_5s.mp4

      - name: Build 11-second Reel from Kling motion
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i protein_motion_5s.mp4 \
            -filter_complex "[0:v]fps=30,scale=1080:1920:flags=lanczos,split=2[a][b];[a][b]concat=n=2:v=1:a=0,trim=duration=10.0,setpts=PTS-STARTPTS,tpad=stop_mode=clone:stop_duration=1.0[out]" \
            -map '[out]' -an \
            -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -movflags +faststart \
            built_capable_reel03_protein_final.mp4

      - name: Validate final output
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=nw=1 built_capable_reel03_protein_final.mp4

      - name: Upload ready-to-post MP4
        uses: actions/upload-artifact@v4
        with:
          name: built_capable_reel03_protein_final
          path: built_capable_reel03_protein_final.mp4
          if-no-files-found: error
          retention-days: 7
