name: Assemble Fitness Reel

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Magnific visual master MP4 signed URL'
        required: true
        type: string
      voice_url:
        description: 'Magnific narration MP3 signed URL'
        required: true
        type: string
      music_url:
        description: 'Magnific music MP3 signed URL (optional)'
        required: false
        type: string
      output_name:
        description: 'Output filename without extension'
        required: false
        default: 'fitness_reel_final'
        type: string

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and subtitle tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-dejavu-core
          python3 -m pip install --user faster-whisper

      - name: Download assets
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VOICE_URL: ${{ inputs.voice_url }}
          MUSIC_URL: ${{ inputs.music_url }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$VIDEO_URL" -o visual.mp4
          curl -L --fail --retry 3 "$VOICE_URL" -o voice.mp3
          if [ -n "${MUSIC_URL:-}" ]; then
            curl -L --fail --retry 3 "$MUSIC_URL" -o music.mp3
          fi
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 visual.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice.mp3

      - name: Generate word-timed captions
        run: |
          cat > make_captions.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path

          model = WhisperModel('small.en', device='cpu', compute_type='int8')
          segments, info = model.transcribe('voice.mp3', beam_size=5, word_timestamps=True)

          def ts(t):
              h = int(t // 3600); t -= h*3600
              m = int(t // 60); t -= m*60
              s = int(t); cs = int(round((t-s)*100))
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          header = '''[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nScaledBorderAndShadow: yes\n\n[V4+ Styles]\nFormat: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding\nStyle: Cap,DejaVu Sans,62,&H00FFFFFF,&H000000FF,&H00111111,&H70000000,-1,0,0,0,100,100,0,0,1,4,1,2,70,70,250,1\n\n[Events]\nFormat: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text\n'''
          lines = [header]
          for seg in segments:
              words = [w for w in (seg.words or []) if w.word.strip()]
              if not words:
                  continue
              chunk=[]
              start=None
              for w in words:
                  if start is None: start=w.start
                  chunk.append(w.word.strip())
                  if len(chunk) >= 4:
                      text=' '.join(chunk).upper().replace('{','(').replace('}',')')
                      lines.append(f"Dialogue: 0,{ts(start)},{ts(w.end)},Cap,,0,0,0,,{text}\\N")
                      chunk=[]; start=None
              if chunk:
                  end=words[-1].end
                  text=' '.join(chunk).upper().replace('{','(').replace('}',')')
                  lines.append(f"Dialogue: 0,{ts(start)},{ts(end)},Cap,,0,0,0,,{text}\\N")
          Path('captions.ass').write_text(''.join(lines), encoding='utf-8')
          PY
          python3 make_captions.py

      - name: Assemble final 1080x1920 MP4
        env:
          OUT: ${{ inputs.output_name }}
        run: |
          set -euo pipefail
          if [ -f music.mp3 ]; then
            ffmpeg -y \
              -i visual.mp4 -i voice.mp3 -stream_loop -1 -i music.mp3 \
              -filter_complex "[0:a]volume=0.25[a0];[1:a]volume=1.0[a1];[2:a]volume=0.08,atrim=0:24[a2];[a0][a1][a2]amix=inputs=3:duration=first:dropout_transition=2[a];[0:v]subtitles=captions.ass:fontsdir=/usr/share/fonts/truetype/dejavu[v]" \
              -map "[v]" -map "[a]" \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart -shortest "${OUT}.mp4"
          else
            ffmpeg -y \
              -i visual.mp4 -i voice.mp3 \
              -filter_complex "[0:a]volume=0.25[a0];[1:a]volume=1.0[a1];[a0][a1]amix=inputs=2:duration=first:dropout_transition=2[a];[0:v]subtitles=captions.ass:fontsdir=/usr/share/fonts/truetype/dejavu[v]" \
              -map "[v]" -map "[a]" \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart -shortest "${OUT}.mp4"
          fi

      - name: Validate output
        env:
          OUT: ${{ inputs.output_name }}
        run: |
          ffprobe -v error -show_streams -show_format "${OUT}.mp4"

      - name: Upload ready-to-post MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}.mp4
          if-no-files-found: error
          retention-days: 7
